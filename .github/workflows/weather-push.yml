name: Daily Weather Push

on:
  schedule:
    # 黄sir: 08:30 北京 = 00:30 UTC
    - cron: '30 0 * * *'
    # 宝宝: 09:00 北京 = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      push_target:
        description: '推送对象: partner=黄sir, me=宝宝, both=全部'
        required: false
        default: 'both'

jobs:
  push-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Create config.json
        run: |
          cat > config.json << 'CONFIGEOF'
          {
            "city": "深圳",
            "openweather": {
              "enabled": true,
              "key": "OPENWEATHER_KEY_PLACEHOLDER"
            },
            "couple": {
              "enabled": true,
              "partner_name": "PARTNER_NAME_PLACEHOLDER",
              "my_pushkey": "MY_PUSHKEY_PLACEHOLDER",
              "partner_pushkey": "PARTNER_PUSHKEY_PLACEHOLDER",
              "love_quotes": [
                "今天也想见到你，谁也别想拦着。",
                "你是我所有的少女情怀和心之所向。",
                "我想和你一起看日出日落，数星星月亮。",
                "有你的地方都是美丽的风景。",
                "每天睁开眼就想见到你。"
              ]
            }
          }
          CONFIGEOF
          # 替换占位符为实际 Secret 值
          sed -i "s|OPENWEATHER_KEY_PLACEHOLDER|${{ secrets.OPENWEATHER_KEY }}|g" config.json
          sed -i "s|PARTNER_NAME_PLACEHOLDER|${{ secrets.PARTNER_NAME }}|g" config.json
          sed -i "s|MY_PUSHKEY_PLACEHOLDER|${{ secrets.MY_PUSHKEY }}|g" config.json
          sed -i "s|PARTNER_PUSHKEY_PLACEHOLDER|${{ secrets.PARTNER_PUSHKEY }}|g" config.json

      - name: Determine push target
        id: target
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "Current UTC time: ${HOUR}:${MIN}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.push_target }}"
            TARGET="${INPUT:-both}"
          elif [ "$HOUR" = "0" ]; then
            TARGET="partner"
          elif [ "$HOUR" = "1" ]; then
            TARGET="me"
          else
            TARGET="both"
          fi

          echo "Push target: $TARGET"
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Push to partner (黄sir 08:30 北京)
        if: steps.target.outputs.target == 'partner' || steps.target.outputs.target == 'both'
        run: node push-partner.js

      - name: Push to me (宝宝 09:00 北京)
        if: steps.target.outputs.target == 'me' || steps.target.outputs.target == 'both'
        run: node push-me.js
